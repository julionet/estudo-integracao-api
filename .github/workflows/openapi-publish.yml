name: OpenAPI Lint e Publicação

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Validar OpenAPI com Spectral
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Executar validação Spectral
        run: spectral lint categorias-api.yml --ruleset .spectral.yml

  publish:
    name: Publicar documentação no GitHub Pages
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar HTML com Redoc
        run: |
          npx redoc-cli build categorias-api.yml \
            --title "API de Categorias" \
            --output docs/index.html

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
