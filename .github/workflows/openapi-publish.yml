name: OpenAPI Lint e Publicação

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint:
    name: Validar OpenAPI com Spectral
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Executar validação Spectral
        run: spectral lint categorias-api.yml --ruleset .spectral.yml

  publish:
    name: Publicar documentação no GitHub Pages
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Redocly CLI
        run: npm install -g @redocly/cli

      - name: Criar pasta docs
        run: mkdir -p docs

      - name: Gerar HTML com Redoc
        run: |
          redocly build-docs categorias-api.yml \
            --title "API de Categorias" \
            --output docs/index.html

      - name: Verificar se index.html foi gerado
        run: |
          if [ ! -f docs/index.html ]; then
            echo "ERRO: docs/index.html não foi gerado"
            exit 1
          fi
          echo "OK: docs/index.html gerado com $(wc -c < docs/index.html) bytes"

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
